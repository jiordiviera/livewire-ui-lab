name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create test branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b ci-test-${{ github.run_id }} || git checkout ci-test-${{ github.run_id }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install Bun dependencies
        run: bun install

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate application key
        run: php artisan key:generate

      - name: Configure environment for SQLite
        run: |
          echo "APP_ENV=testing" >> .env
          echo "APP_URL=http://localhost:8000" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Build assets
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start Laravel server
        run: php artisan serve --host=0.0.0.0 --port=8000 &
        env:
          APP_ENV: testing

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000 > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run Playwright tests
        run: bun run test:e2e -- --project=chromium
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:8000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      DOMAIN: "livewire-ui-lab.jiordiviera.me"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start SSH agent (with deploy key)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Prepare known_hosts (strict)
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          KN=~/.ssh/known_hosts
          touch "$KN"; chmod 600 "$KN"
          ssh-keygen -R "${SERVER_HOST}" || true
          ssh-keygen -R "[${SERVER_HOST}]:${SERVER_PORT:-22}" || true
          ssh-keyscan -p "${SERVER_PORT:-22}" -t ed25519 "${SERVER_HOST}" 2>/dev/null >> "$KN" || true
          ssh-keyscan -p "${SERVER_PORT:-22}"            "${SERVER_HOST}" 2>/dev/null >> "$KN" || true
          echo "known_hosts lines: $(wc -l < "$KN")"

      - name: Deploy over SSH
        env:
          SSH_OPTS: "-o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o StrictHostKeyChecking=yes"
        run: |
          set -euxo pipefail
          ssh -p "${SERVER_PORT:-22}" $SSH_OPTS "${SERVER_USER}@${SERVER_HOST}" bash <<'EOF'
          set -euo pipefail


          cd /var/www/${{ env.DOMAIN }}

          git pull origin main

          composer install --prefer-dist --optimize-autoloader -q
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache || true
          php artisan view:cache  || true
          export BUN_INSTALL="${HOME}/.bun"
          export PATH="${BUN_INSTALL}/bin:${PATH}"
          command -v bun
          bun install
          bun run build
          rm -rf node_modules
          php artisan generate:sitemap

          echo "OK"
          EOF

      - name: Done
        run: echo "✅ Deploy done"
